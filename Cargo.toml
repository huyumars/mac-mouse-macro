[package]
name = "mouse-macro"
version = "0.1.0"
edition = "2021"
description = "A mouse macro application: hold a mouse button to repeatedly simulate keyboard presses"

[dependencies]
rdev = "0.5"
serde = { version = "1", features = ["derive"] }
toml = "0.8"

[target.'cfg(target_os = "macos")'.dependencies]
core-graphics = "0.19"
core-foundation = "0.7"
