[package]
name = "mouse-macro"
version = "0.2.0"
edition = "2021"
description = "A mouse macro application: hold a mouse button to repeatedly simulate keyboard presses"

[dependencies]
rdev = "0.5"
libc = "0.2"
serde = { version = "1", features = ["derive"] }
toml = "0.8"
serde_json = "1"

[target.'cfg(target_os = "macos")'.dependencies]
core-graphics = "0.19"
